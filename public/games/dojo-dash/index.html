<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Dojo Dash – Get to Karate!</title>
<style>
html,body{margin:0;height:100%;background:#1b1b2f;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
canvas{background:#87ceeb;max-width:100vw;max-height:100vh;aspect-ratio:16/9;width:100vw;image-rendering:auto}
#touch{position:fixed;bottom:12px;left:0;right:0;display:none;justify-content:space-between;padding:0 14px;pointer-events:none}
#touch div{display:flex;gap:12px}
.tb{pointer-events:auto;width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.8);color:#fff;font-size:26px;font-weight:bold;display:flex;align-items:center;justify-content:center;text-shadow:0 2px 3px #000}
.tb.on{background:rgba(255,215,0,.6)}
#nameBox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
#nameBox .p{background:#fff8e1;border:5px solid #d32f2f;border-radius:16px;padding:20px 26px;text-align:center;max-width:90vw}
#nameBox input{font-size:22px;padding:8px;width:240px;text-align:center;border:3px solid #333;border-radius:8px}
#nameBox button{font-size:18px;margin:8px 4px 0;padding:8px 14px;border-radius:8px;border:none;background:#d32f2f;color:#fff;font-weight:bold;cursor:pointer}
#nameBox button.alt{background:#555}
.note{font-size:14px;color:#a00;margin:6px 0}
</style></head><body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="touch"><div><div class="tb" data-k="left">◀</div><div class="tb" data-k="right">▶</div></div><div><div class="tb" data-k="kick">🥋</div><div class="tb" data-k="jump">▲</div></div></div>
<div id="nameBox"><div class="p"><h2 style="margin:4px 0">🏆 Leaderboard!</h2><div id="finalScore" style="font-size:20px"></div>
<p>Pick a ninja nickname:</p><input id="nick" maxlength="12" autocomplete="off"><div class="note">⚠️ Nicknames only – no real names please! (max 12 characters)</div>
<button class="alt" id="rnd">🎲 Random</button><button id="save">Save score</button><button class="alt" id="skip">Skip</button></div></div>

function fmt(f){const s=f/60;return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function hud(){rr(10,10,W-20,44,12,'rgba(0,0,0,.45)');txt('⭐ '+score,24,42,22,'#ffd600','left');txt('⏱ '+fmt(totalTime),220,42,22,'#fff','left');txt('❤️'.repeat(Math.max(0,lives)),380,42,20,'#fff','left');
 txt(lv.name.split(':')[0],W/2-10,42,20,'#80deea');rr(W/2+46,20,58,28,6,'rgba(255,255,255,.75)');beltIcon(W/2+50,26,GRADES[grade]);txt(short(GRADES[grade]),W/2+108,42,14,'#fff','left');
 const prog=Math.min(1,P.x/world.door.x);rr(W-260,24,220,16,8,'#333');rr(W-260,24,220*prog,16,8,'#66bb6a');txt('🥋',W-34,40,18);txt('🏫',W-272,40,16);
 let fx=[];if(P.belt)fx.push('🥋 BELT '+Math.ceil(P.belt/60)+'s');if(P.kiai)fx.push('💥 KIAI '+Math.ceil(P.kiai/60)+'s');if(P.heavy)fx.push('🎒 Heavy bag (X)');if(P.laces)fx.push('👟 Laces! (X)');if(P.slow)fx.push('🐌 Slowed');
 fx.forEach((s,i)=>txt(s,20,84+i*24,16,'#fff','left'));if(paused)txt('PAUSED (P)',W/2,H/2,48,'#fff')}
function beltIcon(x,y,G,sc=1){const im=BIMG[GRADES.indexOf(G)];if(im&&im.complete&&im.naturalWidth){g.drawImage(im,x,y-3*sc,50*sc,20*sc);return}if(!G.img){txt('—',x+25*sc,y+12*sc,14*sc,'#ccc');return}g.save();g.translate(x,y);g.scale(sc,sc);rr(0,0,50,14,4,G.c);g.strokeStyle='#000';g.lineWidth=1.5;g.strokeRect(0,0,50,14);rr(18,-4,14,22,3,G.c);g.strokeRect(18,-4,14,22);if(G.s){g.fillStyle=G.sc;for(let q=0;q<G.s;q++)g.fillRect(38+q*5,0,3,14)}g.restore()}
function board(y){const l=getLB();rr(W/2-240,y,480,40+Math.max(1,l.length)*24,14,'rgba(0,0,0,.55)');txt('🏆 TOP 10 NINJAS 🏆',W/2,y+28,22,'#ffd600');
 if(!l.length)txt('No scores yet – be the first!',W/2,y+56,16,'#fff');
 l.forEach((r,i)=>{const yy=y+54+i*24;txt((i+1)+'. '+r.n,W/2-200,yy,16,i<3?'#ffd600':'#fff','left');const G=GRADES[r.b||0];rr(W/2-23,yy-15,36,18,5,'rgba(255,255,255,.75)');beltIcon(W/2-20,yy-10,G,.6);txt(short(G),W/2+16,yy,12,'#ddd','left');txt(r.s+'',W/2+150,yy,16,'#fff','right');txt(r.t?fmt(r.t):'',W/2+210,yy,16,'#aaa','right')})}
function kidDemo(x,y){drawKid(x,y,{anim:frame*.2,on:1,face:1,kick:frame%90<15?12:0,inv:0,belt:0,laces:0,heavy:0,slow:0,stun:0,trip:0})}
function draw(){
 if(state==='title'||((state==='over'||state==='win')&&!world)){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#ff7043');gr.addColorStop(1,'#ffca28');g.fillStyle=gr;g.fillRect(0,0,W,H);
  txt('DOJO DASH!',W/2,80,64,'#fff','center','#b71c1c');txt('School\'s out – get to Forza Karate on time!',W/2,118,22,'#fff');kidDemo(130,330);
  txt('←→ / A D: run   ↑ / W / Space: jump   X: kick   P: pause',W/2,150,17,'#fff');board(165);
  if(frame%60<40)txt('Press SPACE / ENTER or tap to start',W/2,H-24,26,'#fff','center','#b71c1c');return}
 drawBg();drawWorld();hud();
 if(state==='intro'){rr(W/2-300,H/2-80,600,130,20,'rgba(0,0,0,.6)');txt(lv.name,W/2,H/2-30,34,'#ffd600');txt(lv.sub,W/2,H/2+12,22,'#fff')}
 if(state==='stageclear'){const G=GRADES[grade],fin=grade==GRADES.length-1;g.fillStyle='rgba(0,0,0,.7)';g.fillRect(0,0,W,H);
  for(let k=0;k<40;k++){const a=k*0.157+frame*.01;g.fillStyle=['#ffd600','#ff4081','#40c4ff','#69f0ae'][k%4];g.fillRect(W/2+Math.cos(a*3)*(200+k*9)%W*.5,((k*53+frame*3)%H),8,8)}
  txt(fin?'🥋 OSS! You reached the DOJO! 🥋':'🎉 GRADING PASSED! 🎉',W/2,90,fin?38:46,'#ffd600');
  txt('You are now:',W/2,140,26,'#fff');txt(G.n.toUpperCase(),W/2,178,G.n.length>20?28:34,'#fff');txt(G.k||'',W/2,206,22,'#80deea');
  beltIcon(W/2-125,240,G,5);
  drawKid(W/2,430,{anim:frame*.15,on:1,face:1,kick:frame%60<15?12:0,inv:0,belt:0,laces:0,heavy:0,slow:0,stun:0,trip:0,g:grade});
  txt('Stage bonus: +'+msg.bonus+'   Lives: +'+lives*100+'   Score: '+score,W/2,475,20,'#fff');
  txt(fin?'':'Next: '+LEVELS[stageIdx+1].name,W/2,505,18,'#ffcc80');if(msg.t<200&&frame%60<40)txt('Tap / SPACE to continue',W/2,532,16,'#fff')}
 if(state==='over'||state==='win'){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H);txt(state==='win'?'🥋 BLACK BELT! OSS! 🥋':'Late for karate! ('+short(GRADES[bestGrade])+')',W/2,70,46,state==='win'?'#ffd600':'#ff5252');
  txt('Score: '+score+'   Time: '+fmt(totalTime),W/2,108,24,'#fff');board(125);if(frame%60<40)txt('Press SPACE / ENTER or tap to play again',W/2,H-20,24,'#fff')}
}
// ---------- name entry ----------
const nb=document.getElementById('nameBox'),nick=document.getElementById('nick');
function askName(){nb.style.display='flex';document.getElementById('finalScore').textContent='Score: '+score+' • Time: '+fmt(totalTime)+' • Belt: '+GRADES[bestGrade].n+(GRADES[bestGrade].k?' ('+GRADES[bestGrade].k+')':'');nick.value=localStorage.getItem('dojoDashNick')||rndNick();setTimeout(()=>{nick.focus();nick.select()},50)}
function closeName(){nb.style.display='none';anyPressed=0;for(const k in K)K[k]=0}
document.getElementById('rnd').onclick=()=>nick.value=rndNick();
document.getElementById('save').onclick=()=>{const n=clean(nick.value)||rndNick();try{localStorage.setItem('dojoDashNick',n)}catch(e){}addLB(n,score,totalTime,bestGrade);closeName()};
document.getElementById('skip').onclick=closeName;
nick.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')document.getElementById('save').click()});
// ---------- loop ----------
let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){update();acc-=1000/60}draw();requestAnimationFrame(loop)}
window.__dojo={finish:()=>{P.x=world.door.x+30},get grade(){return grade},get state(){return state},start:()=>{anyPressed=1},K,get P(){return P}};
requestAnimationFrame(loop);
})();
</script></body></html>
